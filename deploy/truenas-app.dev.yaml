# LienStore DEV (dev.linconnn.io.vn) — follows the `dev` image that CI publishes on every push to main.
# Pair with a Cron Job:  sh /mnt/apps-pool/lienstore/truenas-autoupdate.sh lienstore ghcr.io/ducanhle92/lienstore:dev
services:
  lienstore:
    image: ghcr.io/ducanhle92/lienstore:dev
    container_name: lienstore
    restart: unless-stopped
    ports:
      - "30080:3000"
    environment:
      NODE_ENV: production
      LIEN_DB_PATH: /app/data/lienstore.db
      LIEN_SEED_SYNC: update
      NEXT_PUBLIC_SITE_URL: https://dev.linconnn.io.vn
      ADMIN_USER: admin
      ADMIN_PASSWORD: CHANGE_ME_STRONG_PASSWORD
      ADMIN_SESSION_SECRET: CHANGE_ME_LONG_RANDOM_STRING
    volumes:
      - /mnt/apps-pool/lienstore/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
