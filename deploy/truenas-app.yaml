# LienStore on TrueNAS SCALE (24.10 Electric Eel / 25.04 Fangtooth+)
# Apps → Discover Apps → ⋮ (top right) → "Install via YAML" → paste this file.
#
# Variant A — PROD. Follows the `latest` tag that release.yml publishes when you push a version tag (v1.x.y).
# Auto-update: TrueNAS Cron Job every 5 min →  sh /mnt/apps-pool/lienstore/truenas-autoupdate.sh lienstore-prod ghcr.io/ducanhle92/lienstore:latest
#   If the package is private, add the registry
#   under Apps → Settings → Manage Container Images / Registries (ghcr.io + a PAT with read:packages).
#
# Before installing:
#   1. Create dataset  <pool>/apps/lienstore   (Datasets → Add Dataset, Share Type: Apps)
#   2. Shell:  mkdir -p /mnt/<pool>/apps/lienstore/data && chown -R 1000:1000 /mnt/<pool>/apps/lienstore
#   3. Change ADMIN_PASSWORD and ADMIN_SESSION_SECRET below (secret: `openssl rand -hex 32`).
#
# First start creates /app/data/lienstore.db (SQLite) and imports the seed catalogue automatically.
services:
  lienstore:
    image: ghcr.io/ducanhle92/lienstore:latest
    container_name: lienstore
    restart: unless-stopped
    ports:
      - "30080:3000"            # LAN: http://<truenas-ip>:30080 — put Cloudflare Tunnel / reverse proxy in front for HTTPS
    environment:
      NODE_ENV: production
      LIEN_DB_PATH: /app/data/lienstore.db
      LIEN_SEED_SYNC: update        # seed updates products, but a product edited in THIS admin after the seed export keeps the server version
      # GHN Production (live shipping quotes at checkout) — fill in and remove the '#':
      # GHN_TOKEN: ""
      # GHN_SHOP_ID: ""
      # GHN_PICKUP_DISTRICT_ID: "1748"
      # GHN_PICKUP_WARD_CODE: "282201"
      NEXT_PUBLIC_SITE_URL: https://linconnn.io.vn
      ADMIN_USER: admin
      ADMIN_PASSWORD: CHANGE_ME_STRONG_PASSWORD
      ADMIN_SESSION_SECRET: CHANGE_ME_LONG_RANDOM_STRING
      # NEXT_PUBLIC_FB_PAGE_ID: ""   # optional Messenger chat bubble
    volumes:
      - /mnt/<pool>/apps/lienstore/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
