# Release pipeline: tag vX.Y.Z → PROMOTE the image CI already built for that commit (`sha-<sha>`, the one running on
# dev) to `X.Y.Z`, `X.Y` and `latest` on GHCR → GitHub Release notes. Takes ~30 s; no rebuild, so prod runs exactly
# the bytes that were tested on dev. Falls back to a fresh linux/amd64 build when the sha image is missing
# (e.g. the tag points at a commit that never reached `main`).
#
# Create a release with `npm run release -- patch|minor|major|X.Y.Z` (scripts/release.mjs): bumps package.json,
# moves the CHANGELOG "Unreleased" notes under the new version, commits, tags and pushes.
# TrueNAS pulls `:latest` from a cron job (deploy/truenas-autoupdate.sh) — nothing here needs to reach the NAS.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lienstore

jobs:
  promote:
    name: Promote tested image → latest
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.wait.outputs.found == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Wait for the CI image of this commit (up to 12 min)
        id: wait
        run: |
          SRC="$IMAGE:sha-${{ github.sha }}"
          for i in $(seq 1 24); do
            if docker manifest inspect "$SRC" >/dev/null 2>&1; then
              echo "found=true" >> "$GITHUB_OUTPUT"; echo "source=$SRC" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "CI image $SRC not published yet (attempt $i) — waiting 30 s"; sleep 30
          done
          echo "found=false" >> "$GITHUB_OUTPUT"
      - name: Retag CI image (no rebuild)
        if: steps.wait.outputs.found == 'true'
        run: |
          set -e
          args=""
          for t in $(printf '%s\n' "${{ steps.meta.outputs.tags }}"); do args="$args -t $t"; done
          docker buildx imagetools create $args "${{ steps.wait.outputs.source }}"
          echo "Promoted ${{ steps.wait.outputs.source }} → ${{ steps.meta.outputs.tags }}" | tr '\n' ' '
      - uses: docker/setup-buildx-action@v3
        if: steps.wait.outputs.found == 'false'
      - name: Fallback build (linux/amd64)
        if: steps.wait.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published image reports the tagged version
        run: |
          set -e
          VER="${{ steps.meta.outputs.version }}"
          docker run --rm -d --name probe -p 3000:3000 -e ADMIN_SESSION_SECRET=ci-probe "$IMAGE:$VER"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health/ >/tmp/h.json 2>/dev/null && break; sleep 2; done
          cat /tmp/h.json; echo
          grep -q "\"version\":\"$VER\"" /tmp/h.json || { echo "::error::image $IMAGE:$VER reports a different version (package.json not bumped before tagging?)"; docker rm -f probe; exit 1; }
          docker rm -f probe
      - name: GitHub Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `${{ env.IMAGE }}:${{ steps.meta.outputs.version }}` (also `latest`).
            Prod (linconnn.io.vn) picks it up from the TrueNAS cron job within a few minutes — check https://linconnn.io.vn/api/health/
